<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 230px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #4f46e5;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #4338ca;
    }
    button.stop {
      background: #dc2626;
    }
    button.stop:hover {
      background: #b91c1c;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      /* Un message d'erreur doit rester entierement lisible, pas deborder */
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
    }
  </style>
</head>
<body>
  <h3>🎬 LiveSub</h3>
  <button id="toggleBtn">▶️ Demarrer</button>
  <div id="status">⏸️ Arrete</div>
  <script src="popup.js"></script>
</body>
</html>
