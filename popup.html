<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 230px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #4f46e5;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #4338ca;
    }
    button.stop {
      background: #dc2626;
    }
    button.stop:hover {
      background: #b91c1c;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #666;
    }
    #retardInfo {
      font-size: 11px;
      color: #4f46e5;
      margin: -8px 0 12px 0;
      min-height: 1.2em;
    }
    select {
      width: 100%;
      padding: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    /* Une case a cocher : le label est a cote, pas au-dessus. */
    .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .option input {
      margin: 2px 0 0 0;
      cursor: pointer;
      flex: none;
    }
    .option label {
      margin: 0;
      cursor: pointer;
      line-height: 1.35;
    }
    .option .aide {
      display: block;
      color: #999;
      font-size: 11px;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      /* Un message d'erreur doit rester entierement lisible, pas deborder */
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
    }
  </style>
</head>
<body>
  <h3>🎬 LiveSub</h3>

  <!-- La `value` est le nom de langue attendu par Transformers.js (anglais,
       minuscule) ; le texte affiche est le nom natif, plus parlant pour qui
       cherche sa langue dans la liste. Attention : "nederlands" n'existe pas
       cote Whisper, la valeur correcte est "dutch". -->
  <label for="langue">Langue parlee dans la video</label>
  <select id="langue">
    <option value="french">Français</option>
    <option value="english">English</option>
    <option value="arabic">العربية</option>
    <option value="spanish">Español</option>
    <option value="german">Deutsch</option>
    <option value="italian">Italiano</option>
    <option value="portuguese">Português</option>
    <option value="dutch">Nederlands</option>
    <option value="russian">Русский</option>
    <option value="chinese">中文</option>
    <option value="japanese">日本語</option>
    <option value="korean">한국어</option>
    <option value="turkish">Türkçe</option>
    <option value="polish">Polski</option>
    <option value="hindi">हिन्दी</option>
  </select>

  <!-- Retarder le son permet de le recaler sur les sous-titres, qui arrivent
       toujours avec un temps de retard (le temps de transcrire). Ca ne rend
       PAS les sous-titres plus rapides : ca ralentit le son pour qu'il les
       rejoigne. -->
  <label for="retardAudio">Retarder le son</label>
  <select id="retardAudio">
    <option value="0">Désactivé</option>
    <option value="auto">Auto (aligné sur la voix)</option>
    <option value="2">2 s</option>
    <option value="5">5 s</option>
    <option value="7">7 s</option>
    <option value="9">9 s</option>
    <option value="11">11 s</option>
    <option value="13">13 s</option>
  </select>
  <div id="retardInfo"></div>

  <!-- Le moteur produit deux textes : le STABLE (confirme par deux passes, il
       ne bougera plus jamais) et la FIN PROVISOIRE (la derniere hypothese, que
       la passe suivante a le droit de corriger).

       Decoche = on n'affiche que le stable : le texte ne fait que s'allonger,
       plus rien ne se reecrit sous les yeux, au prix d'environ 2 s de retard
       en plus. Coche = on montre aussi la fin provisoire : plus reactif, mais
       les derniers mots se corrigent en direct.

       Ca se juge a l'oeil : la case bascule A CHAUD, sans arreter la capture. -->
  <div class="option">
    <input type="checkbox" id="afficherProvisoire">
    <label for="afficherProvisoire">
      Afficher la fin provisoire
      <span class="aide">Plus reactif, mais les derniers mots se corrigent</span>
    </label>
  </div>

  <button id="toggleBtn">▶️ Demarrer</button>
  <div id="status">⏸️ Arrete</div>
  <script src="popup.js"></script>
</body>
</html>
