<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 230px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #4f46e5;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #4338ca;
    }
    button.stop {
      background: #dc2626;
    }
    button.stop:hover {
      background: #b91c1c;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #666;
    }
    #retardInfo {
      font-size: 11px;
      color: #4f46e5;
      margin: -8px 0 12px 0;
      min-height: 1.2em;
    }
    select {
      width: 100%;
      padding: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    /* Une case a cocher : le label est a cote, pas au-dessus. */
    .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .option input {
      margin: 2px 0 0 0;
      cursor: pointer;
      flex: none;
    }
    .option label {
      margin: 0;
      cursor: pointer;
      line-height: 1.35;
    }
    .option .aide {
      display: block;
      color: #999;
      font-size: 11px;
    }
    #prepStatus {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      /* Un message d'erreur doit rester entierement lisible, pas deborder */
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
    }
  </style>
</head>
<body>
  <h3>🎬 LiveSub</h3>

  <!-- ⚠️ UN SEUL BOUTON, ET AUCUN REGLAGE. Ce n'est pas un oubli.

       Ont disparu a l'etape 5, avec le mode direct :

       - le CHOIX DU MODE : il n'y en a plus qu'un. Le direct avait servi a
         demontrer le triangle impossible (texte synchrone avec le son, son
         synchrone avec l'image, transcription en direct : deux sur trois au
         mieux). Il a prouve ce qu'il avait a prouver.

       - la LANGUE PARLEE : Parakeet la detecte tout seul, son vocabulaire ne
         contient aucun jeton de langue. Whisper, lui, en avait besoin. Le menu
         etait devenu un bouton debranche.

       - le RETARD DU SON : il servait a ramener le son sur des sous-titres qui
         arrivaient en retard. En preparation, le texte est pret AVANT la
         lecture : il n'y a plus de retard a rattraper.

       - la case AFFICHER LA FIN PROVISOIRE : elle decrivait LocalAgreement-2
         (texte stable confirme par deux passes / fin encore incertaine), un
         mecanisme du moteur en flux qui n'existe plus. -->
  <button id="prepBtn">▶️ Demarrer</button>
  <div id="prepStatus">⏸️ Pret a demarrer</div>

  <script src="popup.js"></script>
</body>
</html>
