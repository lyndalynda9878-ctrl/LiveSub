<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 230px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #4f46e5;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #4338ca;
    }
    button.stop {
      background: #dc2626;
    }
    button.stop:hover {
      background: #b91c1c;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #666;
    }
    #retardInfo {
      font-size: 11px;
      color: #4f46e5;
      margin: -8px 0 12px 0;
      min-height: 1.2em;
    }
    select {
      width: 100%;
      padding: 7px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    /* Une case a cocher : le label est a cote, pas au-dessus. */
    .option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .option input {
      margin: 2px 0 0 0;
      cursor: pointer;
      flex: none;
    }
    .option label {
      margin: 0;
      cursor: pointer;
      line-height: 1.35;
    }
    .option .aide {
      display: block;
      color: #999;
      font-size: 11px;
    }
    /* Le second bouton : refaire une preparation qu'on a deja en memoire.
       Il est SECONDAIRE et il en a l'air -- l'action normale, sur une video
       connue, est de relire la memoire, pas de repayer quatre minutes. */
    button.secondaire {
      background: #fff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      font-size: 13px;
      padding: 7px;
      margin-top: 8px;
      font-weight: normal;
    }
    button.secondaire:hover {
      background: #eef2ff;
    }
    /* Une video deja en memoire : le bouton principal change de sens, il doit
       donc changer de couleur. Le vert dit « il n'y a rien a attendre ». */
    button.memoire {
      background: #0f9d63;
      font-size: 13px;
      line-height: 1.3;
    }
    button.memoire:hover {
      background: #0c7d4f;
    }
    /* Ce que la memoire contient, et la place qu'elle prend. La place est
       affichee TOUJOURS, meme quand la video est inconnue : c'est la seule
       facon de voir venir le moment ou il faudra supprimer quelque chose. */
    #memInfo {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
      font-size: 11px;
      color: #666;
      line-height: 1.45;
      white-space: pre-line;
      overflow-wrap: break-word;
    }
    #prepStatus {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
      /* Un message d'echec dit trois choses -- ce qui manque, ou, quoi faire --
         et il les dit sur trois lignes. Sans `pre-line` elles seraient recollees
         en un seul bloc de 230 px de large, illisible. `min-height` est un
         plancher, pas un plafond : la popup s'agrandit pour le message. */
      white-space: pre-line;
    }
    /* La devinette de langue de depart : on DIT qu'elle est une devinette, et
       d'ou elle vient. Un menu pre-rempli sans explication passe pour un fait. */
    #tradAide {
      font-size: 11px;
      color: #999;
      margin: -8px 0 12px 0;
      line-height: 1.35;
      min-height: 1.2em;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #666;
      /* Un message d'erreur doit rester entierement lisible, pas deborder */
      line-height: 1.35;
      overflow-wrap: break-word;
      min-height: 2.7em;
    }
  </style>
</head>
<body>
  <h3>🎬 LiveSub</h3>

  <!-- ⚠️ UN SEUL BOUTON, ET AUCUN REGLAGE. Ce n'est pas un oubli.

       Ont disparu a l'etape 5, avec le mode direct :

       - le CHOIX DU MODE : il n'y en a plus qu'un. Le direct avait servi a
         demontrer le triangle impossible (texte synchrone avec le son, son
         synchrone avec l'image, transcription en direct : deux sur trois au
         mieux). Il a prouve ce qu'il avait a prouver.

       - la LANGUE PARLEE : Parakeet la detecte tout seul, son vocabulaire ne
         contient aucun jeton de langue. Whisper, lui, en avait besoin. Le menu
         etait devenu un bouton debranche.

       - le RETARD DU SON : il servait a ramener le son sur des sous-titres qui
         arrivaient en retard. En preparation, le texte est pret AVANT la
         lecture : il n'y a plus de retard a rattraper.

       - la case AFFICHER LA FIN PROVISOIRE : elle decrivait LocalAgreement-2
         (texte stable confirme par deux passes / fin encore incertaine), un
         mecanisme du moteur en flux qui n'existe plus. -->
  <!-- ⚠️ LE MENU PORTE LA PAIRE, PAS SEULEMENT LA CIBLE, et ce n'est pas un
       reglage de plus : c'est une CONTRAINTE DE L'API, mesuree le 2026-08-31.
       `Translator.create()` exige une langue source valide --
       `sourceLanguage: "auto"` leve `RangeError: Invalid language tag: auto`,
       une source omise leve `TypeError: Required member is undefined`. Et
       Parakeet, lui, ne dit JAMAIS quelle langue il a entendue : son
       vocabulaire ne contient aucun jeton de langue.

       La langue de depart est donc PRE-REMPLIE PAR UNE DEVINETTE (le titre de
       l'onglet passe a chrome.i18n.detectLanguage, 100 % local), et verifiee
       APRES coup sur la vraie transcription. La devinette ne decide rien : elle
       remplit une case que tu peux corriger. -->
  <label for="tradSource">Langue parlée dans la vidéo</label>
  <select id="tradSource"></select>

  <label for="tradCible">Langue des sous-titres</label>
  <select id="tradCible"></select>
  <div id="tradAide"></div>

  <button id="prepBtn">▶️ Demarrer</button>
  <!-- ⚠️ « Refaire » n'est visible QUE si la video est deja en memoire. Un
       bouton « refaire » sur une video jamais preparee ne voudrait rien dire,
       et un bouton qui ne veut rien dire finit par etre clique. -->
  <button id="refaireBtn" class="secondaire" hidden>🔄 Refaire la preparation</button>
  <div id="prepStatus">⏸️ Pret a demarrer</div>
  <div id="memInfo"></div>

  <script src="popup.js"></script>
</body>
</html>
